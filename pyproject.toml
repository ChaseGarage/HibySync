[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hiby-music-tools"
version = "0.2.0"
description = "Prepare and synchronize a local music library for the HiBy R1"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow>=9.1", "mutagen>=1.45"]

[project.optional-dependencies]
gui = ["PySide6>=6.5,<7", "dbus-next>=0.2.3,<1"]

[project.scripts]
hiby-music-sanitize = "hiby_music_tools.sanitize:main"
hiby-online-art = "hiby_music_tools.online_art:main"
musicimport = "hiby_music_tools.importer:main"
musicsync = "hiby_music_tools.sync:main"
hibysync = "hiby_music_tools.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"hiby_music_tools.gui" = ["qml/*.qml", "qml/qmldir", "qml/components/*.qml", "qml/pages/*.qml"]
